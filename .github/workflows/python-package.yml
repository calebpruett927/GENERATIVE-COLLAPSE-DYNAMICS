# This workflow installs the package and runs lint/tests on every supported Python version.
# The supported range is governed by pyproject.toml (requires-python = ">=3.11").

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install package and test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 -e ".[test]"
    - name: Lint with flake8
      run: |
        # Stop the build on Python syntax errors or undefined names.
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Report non-blocking style/complexity statistics.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        python -m pytest
